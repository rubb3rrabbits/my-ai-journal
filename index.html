<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 max-w-md mx-auto font-sans">

  <header class="py-4 border-b border-slate-800">
    <h1 class="text-xl font-bold text-indigo-400">My AI Journal</h1>
  </header>

  <!-- API KEY INPUT -->
  <section class="my-4 bg-slate-800 p-3 rounded-lg">
    <label class="block text-xs text-slate-400 mb-1">Google Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your key here" 
           class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
  </section>

  <!-- JOURNAL ENTRY BOX -->
  <main class="flex flex-col gap-3 my-2">
    <textarea id="entryText" rows="6" placeholder="What is on your mind today?" 
              class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
    
    <button onclick="submitEntry()" id="submitBtn" 
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition-all">
      Analyze & Get Feedback
    </button>
  </main>

  <!-- FEEDBACK BOX -->
  <section id="feedbackArea" class="hidden my-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
    <h3 class="text-sm font-semibold text-indigo-400 mb-2">AI Feedback</h3>
    <div id="feedbackContent" class="text-sm text-slate-300 leading-relaxed space-y-2"></div>
  </section>

  <script>
    // Rosebud-style journaling persona prompt
    const SYSTEM_INSTRUCTION = `You are an empathetic, insightful personal AI journal coach modeled after reflective journaling partners.
Your job is to read the user's journal entry, validate their feelings, identify patterns or habits, and offer 1-2 thoughtful follow-up questions.

Format:
1. Reflection & Validation (2-3 sentences)
2. Patterns or Habits Observed (bullet points)
3. Deepening Question (1 follow-up question)`;

    // Auto-load saved API key from phone storage
    document.getElementById('apiKey').value = localStorage.getItem('gemini_journal_key') || '';
    
    // Save key to phone storage whenever it changes
    document.getElementById('apiKey').addEventListener('input', (e) => {
      localStorage.setItem('gemini_journal_key', e.target.value.trim());
    });

    async function submitEntry() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const text = document.getElementById('entryText').value.trim();

      if (!apiKey) {
        alert('Please paste your Gemini API key!');
        return;
      }
      if (!text) {
        alert('Please write a journal entry first!');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Analyzing with Gemini...';
      btn.disabled = true;

      // Gemini API endpoint URL
      const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            // Passing the key in this custom header supports AQ. Auth keys
            'x-goog-api-key': apiKey 
          },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: SYSTEM_INSTRUCTION }]
            },
            contents: [
              {
                parts: [{ text: `Journal Entry:\n${text}` }]
              }
            ]
          })
        });

        const data = await response.json();

        // Handle API errors cleanly
        if (data.error) {
          throw new Error(data.error.message);
        }

        const aiResponse = data.candidates[0].content.parts[0].text;

        // Render feedback formatted with line breaks
        document.getElementById('feedbackContent').innerHTML = aiResponse.replace(/\n/g, '<br>');
        document.getElementById('feedbackArea').classList.remove('hidden');
      } catch (error) {
        console.error(error);
        alert('Error: ' + error.message);
      } finally {
        btn.innerText = 'Analyze & Get Feedback';
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
