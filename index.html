<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 max-w-md mx-auto font-sans">

  <header class="py-4 border-b border-slate-800">
    <h1 class="text-xl font-bold text-indigo-400">My AI Journal</h1>
  </header>

  <!-- GEMINI API KEY INPUT -->
  <section class="my-4 bg-slate-800 p-3 rounded-lg">
    <label class="block text-xs text-slate-400 mb-1">Google Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your AIzaSy... key here" 
           class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
  </section>

  <!-- JOURNAL ENTRY BOX -->
  <main class="flex flex-col gap-3 my-2">
    <textarea id="entryText" rows="6" placeholder="What is on your mind today?" 
              class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-100"></textarea>
    
    <button onclick="submitEntry()" id="submitBtn" 
            class="w-full bg-indigo-600 text-white font-medium py-3 rounded-xl">
      Analyze & Get Feedback
    </button>
  </main>

  <!-- FEEDBACK BOX -->
  <section id="feedbackArea" class="hidden my-4 bg-slate-800 p-4 rounded-xl">
    <h3 class="text-sm font-semibold text-indigo-400 mb-2">AI Feedback</h3>
    <div id="feedbackContent" class="text-sm text-slate-300"></div>
  </section>

  <script>
    const SYSTEM_INSTRUCTION = "You are an empathetic personal AI journal coach. Validate feelings, note mood/patterns, and ask 1 deep follow-up question.";

    async function submitEntry() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const text = document.getElementById('entryText').value.trim();

      if (!apiKey || !text) {
        alert('Please enter your Gemini API key and a journal entry!');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Analyzing with Gemini...';

      // Calling Gemini API
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: SYSTEM_INSTRUCTION }]
            },
            contents: [
              {
                parts: [{ text: `Journal Entry:\n${text}` }]
              }
            ]
          })
        });

        const data = await response.json();
        
        // Extracting text from Gemini's JSON structure
        const aiResponse = data.candidates[0].content.parts[0].text;

        document.getElementById('feedbackContent').innerText = aiResponse;
        document.getElementById('feedbackArea').classList.remove('hidden');
      } catch (error) {
        console.error(error);
        alert('Error connecting to Gemini API. Check your API key!');
      } finally {
        btn.innerText = 'Analyze & Get Feedback';
      }
    }
  </script>

</body>
</html>
