<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 1. META TAGS: Tells the phone how to scale the page properly on mobile screens -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Journal</title>

  <!-- 2. TAILWIND CSS: Loads our styling framework from the web -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- 3. BODY: Everything inside <body> is what gets displayed on your phone screen -->
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 max-w-md mx-auto font-sans">

  <!-- HEADER: The app title at the top -->
  <header class="py-4 border-b border-slate-800">
    <h1 class="text-xl font-bold text-indigo-400">My AI Journal</h1>
  </header>

  <!-- API KEY INPUT: Holds your private key securely in memory -->
  <section class="my-4 bg-slate-800 p-3 rounded-lg">
    <label class="block text-xs text-slate-400 mb-1">OpenAI API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API key here" 
           class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
  </section>

  <!-- JOURNAL ENTRY BOX: Where you type your reflections -->
  <main class="flex flex-col gap-3 my-2">
    <textarea id="entryText" rows="6" placeholder="What is on your mind today?" 
              class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-100"></textarea>
    
    <!-- BUTTON: Triggers our JavaScript function when tapped -->
    <button onclick="submitEntry()" id="submitBtn" 
            class="w-full bg-indigo-600 text-white font-medium py-3 rounded-xl">
      Analyze & Get Feedback
    </button>
  </main>

  <!-- FEEDBACK BOX: Displays the response returned by OpenAI -->
  <section id="feedbackArea" class="hidden my-4 bg-slate-800 p-4 rounded-xl">
    <h3 class="text-sm font-semibold text-indigo-400 mb-2">AI Feedback</h3>
    <div id="feedbackContent" class="text-sm text-slate-300"></div>
  </section>

  <!-- 4. JAVASCRIPT: The logic that powers the app -->
  <script>
    // A JavaScript variable storing instructions for how the AI should act
    const SYSTEM_PROMPT = "You are an empathetic journaling coach. Validate feelings and ask one deep follow-up question.";

    // An ASYNC FUNCTION: A block of code that waits for internet requests to finish
    async function submitEntry() {
      // Grab values from our HTML elements using their unique IDs
      const apiKey = document.getElementById('apiKey').value;
      const text = document.getElementById('entryText').value;

      if (!apiKey || !text) {
        alert('Please enter both your API key and a journal entry!');
        return;
      }

      // Update button text to show progress
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Analyzing...';

      try {
        // FETCH: Sends an HTTP POST request to OpenAI's server across the web
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              { role: 'system', content: SYSTEM_PROMPT },
              { role: 'user', content: text }
            ]
          })
        });

        // Convert the raw response into a readable JSON object
        const data = await response.json();
        const aiResponse = data.choices[0].message.content;

        // Display the AI response inside our feedback section
        document.getElementById('feedbackContent').innerText = aiResponse;
        document.getElementById('feedbackArea').classList.remove('hidden');
      } catch (error) {
        alert('Error connecting to OpenAI. Check your API key!');
      } finally {
        btn.innerText = 'Analyze & Get Feedback';
      }
    }
  </script>

</body>
</html>
